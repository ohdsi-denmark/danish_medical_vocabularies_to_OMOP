name: Deploy mapping website

on:
  push:
    branches: [website-release]

permissions:
  contents: read

concurrency:
  group: mapping-website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build website and versioned mapping snapshots
        run: python website/build.py

      - name: Check mapping website
        run: node --test website/test_drugs.mjs

      - name: Apply database migrations and deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: |
            d1 migrations apply omop_mapping_submissions --remote
            deploy
