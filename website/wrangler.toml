name = "danish-omop-mapping-explorer"
main = "worker.mjs"
compatibility_date = "2026-11-04"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "SUBMISSIONS"
database_name = "danish-omop-submissions"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[ratelimits]]
name = "PROPOSAL_RATE"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[vars]
GITHUB_REPOSITORY = "ohdsi-denmark/danish_medical_vocabularies_to_OMOP"
