name = "omop-mapping-review"
main = "worker.mjs"
compatibility_date = "2026-11-04"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "SUBMISSIONS"
database_name = "omop_mapping_submissions"
database_id = "199c52cd-0010-4555-9959-68eb1a19d763"

[[ratelimits]]
name = "PROPOSAL_RATE"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[vars]
GITHUB_REPOSITORY = "ohdsi-denmark/danish_medical_vocabularies_to_OMOP"
